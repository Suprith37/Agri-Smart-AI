<section class="fertilizer-section">

  <h1 class="page-title">Fertilizer Recommendation</h1>

  <section class="input-section">
    <div class="input-content">
      <div class="image-column">
        <img loading="lazy" src="https://cdn.builder.io/api/v1/image/assets/TEMP/5fde3c2b24b28eea943fd209cad452272815044783665723eff7c065924b7db8?placeholderIfAbsent=true&apiKey=9d5777f012014f9187fd294a9a9d75d4" alt="Fertilizer recommendation illustration" class="fertilizer-image" />

      <div class="form-column">

            <label for="file">Upload Soil Report (PDF):</label>
            <input type="file" id="file" accept=".pdf" >

          <!-- <button onclick="uploadFile()">Analyze Report</button> -->

          <div class="form_grps" style="position:relative; top:20px; display: flex; gap: 20px; flex-direction: column;">
          <label for="Nitrogen" class="visually-hidden">Nitrogen</label>
          <input 
            type="number"
            class="form-control"
            id="Nitrogen"
            name="nitrogen"
            placeholder="Enter the Nitrogen value (example:50)"
            style="font-weight: bold"
            required
          />
          
          <label for="Phosphorus" class="visually-hidden">Phosphorus</label>
          <input 
            type="number"
            class="form-control"
            id="Phosphorus" 
            name="phosphorus"
            placeholder="Enter the Phosphorous value (example:50)"
            style="font-weight: bold"
            required
          />
          
          <label for="Potassium" class="visually-hidden">Potassium</label>
          <input 
          type="number"
          class="form-control"
          id="Potassium" 
          name="potassium"

          <div class="form-group">
            <label for="crop" style="font-size: 17px"
              ><b style="font: 700 20px Plus Jakarta Sans, -apple-system, Roboto, Helvetica, sans-serif;">Crop you want to grow</b></label

              <option>blackgram</option>
              <option>lentil</option>
              <option>pomegranate</option>
              <option>banana</option>
              <option>mango</option>
              <option>grapes</option>
              <option>watermelon</option>
              <option>muskmelon</option>
              <option>apple</option>
              <option>orange</option>
              <option>papaya</option>
              <option>coconut</option>
              <option>cotton</option>
              <option>jute</option>
              <option>coffee</option>
            </select>
          </div>
        </div>
      
          <button type="submit" class="submit-btn">Submit</button>
        </form>
      </div>
    </div>
  </section>

<script>
  function uploadFile() {
    const fileInput = document.getElementById('file');
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        // Fill the form with extracted values
        document.getElementById('Nitrogen').value = data['Nitrogen (N)'] || '';
        document.getElementById('Phosphorus').value = data['Phosphorus (P2O5)'] || '';
        document.getElementById('Potassium').value = data['Potassium (K2O)'] || '';

        if (data.debug) {
            console.log('Debug Info:', data.debug);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error processing the file. Please try again.');
    });
}

</script>
