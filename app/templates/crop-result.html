<style>
  body {
    background-color: #f8f9fa; /* Light background for contrast */
    font-family: 'Arial', sans-serif; /* Modern font */
    /* background-color: #28a745; */
    height:100vh;
  }

  .container {
    margin: 0 auto; /* Center the container */
    padding: 2rem; /* Add padding */
    max-width: 800px; /* Limit the width for better readability */
    border-radius: 10px; /* Rounded corners */
    /* box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); Subtle shadow for depth */
    /* background-color: #ffffff; White background for the card */
    position: relative;
    top: 100px;
     /* Add space below the container */
    /* background-color: #00a116; */
    
    height:400px;

    
  }

  h1 {
    font-size: 2.5rem; /* Larger font size for the heading */
    color: #333; /* Darker text color for better readability */
    margin-bottom: 1rem; /* Space below the heading */
  }

  .highlight {
    color: #28a745; /* Green color for the prediction */
    font-weight: bold; /* Bold text for emphasis */
  }

  .card {
    padding: 2rem; /* Padding inside the card */
    border-radius: 10px; /* Rounded corners */
    text-align: center; /* Center text */
    position:relative;
    /* top:80px; */
  }

  .btn {
    margin-top: 1.5rem; /* Space above the button */
    padding: 0.75rem 1.5rem; /* Button padding */
    font-size: 1rem; /* Button font size */
    color: #fff; /* White text color */
    background-color: #007bff; /* Bootstrap primary color */
    border: none; /* No border */
    border-radius: 5px; /* Rounded button */
    cursor: pointer; /* Pointer cursor on hover */
    transition: background-color 0.3s; /* Smooth transition */
  }

  .btn:hover {
    background-color: #0056b3; /* Darker blue on hover */
  }
</style>

<div class="container my-5">
  <div class="card">
      <h1>You should grow <span class="highlight">{{ prediction }}</span> in your farm</h1>
      <!-- <button class="btn">Get More Tips</button> Optional button for interaction -->
      <!-- <button class="btn" id="getMoreTipsButton">Get More Tips</button> -->
       <a href="{{ url_for('guide')}}" class="btn">Get More tips</a>
    </div>
</div>



{% endblock %}
