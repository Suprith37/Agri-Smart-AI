{% extends 'layout.html' %} {% block body %}





<style>
  

  .plant-disease-container {
    background-color: rgba(0, 122, 255, 0.9);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column; /* Stack elements vertically */
    align-items: center; /* Center align items */
    padding: 40px;
    border-radius: 15px;
    margin: 20px auto;
    max-width: 1200px; /* Limit the width for better readability */
    position: relative;
    top:40px;
    height: 900px;
    /* margin-bottom: 50px; */
    scale:0.8;
    /* bottom: */
  }

  /* h2 {
    color: #fff;
    margin-bottom: 20px;
    text-align: center; 
  } */

  .content-wrapper {
    display: flex;
    gap: 40px; /* Space between image and upload sections */
    width: 100%; /* Full width of the container */
    position:relative;
    bottom:30px;
  }

  .image-section {
    flex: 1; /* Allow the image section to grow */
    display: flex;
    justify-content: flex-start; /* Center the image */
    align-items: flex-start; /* Center the image vertically */  
    position:relative;
    bottom:70px;
    left:30px;
  }

  .upload-section {
    flex: 1; /* Allow the upload section to grow */
    display: flex;
    flex-direction: column;
    align-items: center;
  
    /* border: 2px solid white; */
    position:relative;
    right:50px;
    

  }

  .upload-title {
    color: #fff;
    font-size: 24px;
    margin-bottom: 15px;
    position:relative;
    top:150px;
    /* font-family: 800 79px Plus Jakarta Sans, -apple-system, Roboto, Helvetica, sans-serif; */
    font-weight: 700;
  }
  .upload-section input{
    position:relative;
    top:180px;
    left : 150px;

  }

  .submit-button {
    background-color: #eaea79;
    color: #fff;
    border: none;
    border-radius: 25px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s;
    position:relative;
    top:50px;
  }

  .submit-button:hover {
    background-color: #0056b3; /* Darker shade on hover */
  }

  .plant-image {
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    max-width: 100%;
    height: auto;
    scale: 0.7;
    position:relative;
    top:50px;
  }

  .page-title{
    font-family: 800 79px Plus Jakarta Sans, -apple-system, Roboto, Helvetica, sans-serif;
    scale: 0.7;
      color:whitesmoke;
  }

  .plant{
    position:relative;
    top:200px;
  }

  .upload-section button{
    position:relative;
    top:250px;
  }
  /* #output-image{
    position:relative;
    top:200px;
  } */
  @media (max-width: 600px) {
    .plant-disease-container {
      padding: 20px;
    }

    .upload-title {
      font-size: 20px;
    }

    .submit-button {
      font-size: 16px;
    }
  }



  .button-89 {
  --b: 3px;   /* border thickness */
  --s: .45em; /* size of the corner */
  --color: #f5f7fb;
  
  padding: calc(.5em + var(--s)) calc(.9em + var(--s));
  color: var(--color);
  --_p: var(--s);
  background:
    conic-gradient(from 90deg at var(--b) var(--b),#0000 90deg,var(--color) 0)
    var(--_p) var(--_p)/calc(100% - var(--b) - 2*var(--_p)) calc(100% - var(--b) - 2*var(--_p));
  transition: .3s linear, color 0s, background-color 0s;
  outline: var(--b) solid #0000;
  outline-offset: .6em;
  font-size: 16px;

  border: 0;

  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  color:white;
  font-family:monospace;
  height:60px;
  width:150px;
  font-weight: 800;
}

.button-89:hover,
.button-89:focus-visible{
  --_p: 0px;
  outline-color: var(--color);
  outline-offset: .05em;
}

.button-89:active {
  background: var(--color);
  color: #fff;
}
</style>

<div class="plant-disease-container">

  <h1 class="page-title" style="font: 800 79px Plus Jakarta Sans, -apple-system, Roboto, Helvetica, sans-serif;">Plant Disease Detection</h1>

  <form class="form-signin" method="post" enctype="multipart/form-data">
     
  <div class="content-wrapper">
    <!-- Image Section -->

             
    <section class="image-section">
      <img
           loading="lazy" 
           src="https://cdn.builder.io/api/v1/image/assets/TEMP/967fcb283216c3029474642c9aee7d7cf0f8849f9f95f41817c641b58eec64a0?placeholderIfAbsent=true&apiKey=9d5777f012014f9187fd294a9a9d75d4" 
           class="plant-image"
           alt="Plant disease detection example" 
      />
    </section>

    <!-- Upload Section -->
    <section class="upload-section">
  
      <h2 class="upload-title" style="font-family: 600 39px Plus Jakarta Sans, -apple-system, Roboto, Helvetica, sans-serif;">Please Upload The Infected Image of the Leaf</h2>
  <input type="file" name="file" class="form-control-file" id="inputfile" onchange="preview_image(event)" accept="image/*" style="display: none;">
  <img id="output-image" src="/static/images/upload.png"  class="plant" alt="Preview"  onclick="triggerFileInput()" style="cursor: pointer; border: 2px dashed #007bff; padding: 20px; border-radius: 15px;  max-width: 100%; width:300px; height: 300px;" />

      <button class="button-89" role="button">Predict</button>
   
    </section>
  </div> 
</form>
</div>

<script type="text/javascript">
  
       function triggerFileInput() {
    document.getElementById('inputfile').click();
  }

  console.log("1892")
    function preview_image(event) {
      var reader = new FileReader();
      reader.onload = function () {
        var output = document.getElementById('output-image')
        output.src = reader.result;
      }
      reader.readAsDataURL(event.target.files[0]);
    }
</script>



{% endblock %}
